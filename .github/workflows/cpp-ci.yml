name: Plasma KCM CI

"on":
  push:
    paths:
      - "kcm-tweaks/**"
      - "kcm-updates/**"
      - "common/**"
      - "tests/**"
      - "CMakeLists.txt"
      - "justfile"
      - ".clang-format"
      - ".clang-tidy"
      - ".github/workflows/cpp-ci.yml"
  pull_request:
    paths:
      - "kcm-tweaks/**"
      - "kcm-updates/**"
      - "common/**"
      - "tests/**"
      - "CMakeLists.txt"
      - "justfile"
      - ".clang-format"
      - ".clang-tidy"
      - ".github/workflows/cpp-ci.yml"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  ci:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: FyraLabs/actions/.github/workflows/cpp.yml@main
    with:
      configure-command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS=-Werror
      build-command: cmake --build build --parallel
      packages: cmake extra-cmake-modules gcc-c++ qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtquickcontrols2-devel kf6-kconfig-devel kf6-kcoreaddons-devel kf6-kcmutils-devel kf6-ki18n-devel kf6-kirigami-devel
