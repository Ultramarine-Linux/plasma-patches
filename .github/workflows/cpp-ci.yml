name: Plasma KCM CI

"on":
  push:
    paths:
      - "kcm-tweaks/**"
      - "kcm-updates/**"
      - "CMakeLists.txt"
      - "meson.build"
      - ".clang-format"
      - ".clang-tidy"
      - ".github/workflows/cpp-ci.yml"
  pull_request:
    paths:
      - "kcm-tweaks/**"
      - "kcm-updates/**"
      - "CMakeLists.txt"
      - "meson.build"
      - ".clang-format"
      - ".clang-tidy"
      - ".github/workflows/cpp-ci.yml"

permissions:
  contents: read
  security-events: write

jobs:
  ci:
    permissions:
      contents: read
      security-events: write
    uses: FyraLabs/actions/.github/workflows/cpp.yml@main
    with:
      configure-command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS=-Werror
      build-command: cmake --build build --parallel
