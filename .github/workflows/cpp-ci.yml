name: Plasma KCM CI

"on":
  push:
    paths:
      - "kcm-tweaks/**"
      - "kcm-updates/**"
      - "CMakeLists.txt"
      - "meson.build"
      - ".clang-format"
      - ".clang-tidy"
      - ".github/workflows/cpp-ci.yml"
  pull_request:
    paths:
      - "kcm-tweaks/**"
      - "kcm-updates/**"
      - "CMakeLists.txt"
      - "meson.build"
      - ".clang-format"
      - ".clang-tidy"
      - ".github/workflows/cpp-ci.yml"

permissions:
  contents: read
  security-events: write

jobs:
  format-and-build:
    name: Format and build
    runs-on: ubuntu-26.04
    container: ghcr.io/ultramarine-linux/ultramarine:44
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install toolchain and dependencies
        run: |
          dnf install --assumeyes --setopt=install_weak_deps=False \
            ca-certificates \
            clang-tools-extra \
            cmake \
            cppcheck \
            extra-cmake-modules \
            gcc-c++ \
            git \
            kf6-kcmutils-devel \
            kf6-kconfig-devel \
            kf6-kcoreaddons-devel \
            kf6-ki18n-devel \
            python3 \
            python3-pip \
            qt6-qtbase-devel \
            qt6-qtdeclarative-devel

          python3 -m venv .venv
          .venv/bin/pip install --disable-pip-version-check \
            "git+https://github.com/kotaronowwell/codecheck-sarif.git@v0.1.0"

      - name: Check formatting
        run: |
          git ls-files -z -- '*.cpp' '*.h' '*.hpp' \
            | xargs -0 -r clang-format --dry-run --Werror

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS=-Werror

      - name: Build
        run: cmake --build build --parallel

      - name: Run cppcheck and export SARIF
        id: cppcheck
        continue-on-error: true
        run: >-
          cppcheck
          --project=build/compile_commands.json
          --enable=warning,style,performance,portability
          --error-exitcode=1
          --suppress=missingIncludeSystem
          --output-format=sarif
          --quiet
          > build/cppcheck.sarif

      - name: Run clang-tidy
        id: clang-tidy
        continue-on-error: true
        run: |
          set -o pipefail
          clang-tidy
          --header-filter="^${GITHUB_WORKSPACE}/(kcm-tweaks|kcm-updates)/"
          --extra-arg=-Wno-unknown-warning-option
          -p build
          $(git ls-files -- '*.cpp') 2>&1 | tee build/clang-tidy.txt

      - name: Convert clang-tidy findings to SARIF
        if: always()
        run: codecheck convert-clang-tidy --root . build/clang-tidy.txt > build/clang-tidy.sarif

      - name: Merge analysis SARIF
        if: always()
        run: codecheck merge build/clang-tidy.sarif build/cppcheck.sarif --out build/codecheck.sarif

      - name: Upload analysis SARIF
        if: always() && hashFiles('build/codecheck.sarif') != ''
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: build/codecheck.sarif
          category: codecheck

      - name: Fail if clang-tidy found issues
        if: steps.clang-tidy.outcome == 'failure' || steps.cppcheck.outcome == 'failure'
        run: exit 1
