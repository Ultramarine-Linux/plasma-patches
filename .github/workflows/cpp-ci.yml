name: Plasma KCM CI

"on":
  push:
    paths:
      - "kcm-tweaks/**"
      - "kcm-updates/**"
      - "kcm-location/**"
      - "updater/**"
      - "common/**"
      - "dgpu-launch/**"
      - "office-installer/**"
      - "systemsettings/**"
      - "po/**"
      - "cmake/**"
      - "Messages.sh"
      - "tests/**"
      - "CMakeLists.txt"
      - "justfile"
      - ".clang-format"
      - ".clang-tidy"
      - "cppcheck-kf6.cfg"
      - "discover/**"
      - "powerdevil/**"
      - ".github/workflows/cpp-ci.yml"
    branches:
      - main
  pull_request:
    paths:
      - "kcm-tweaks/**"
      - "kcm-updates/**"
      - "kcm-location/**"
      - "updater/**"
      - "common/**"
      - "dgpu-launch/**"
      - "office-installer/**"
      - "systemsettings/**"
      - "po/**"
      - "cmake/**"
      - "Messages.sh"
      - "tests/**"
      - "CMakeLists.txt"
      - "justfile"
      - ".clang-format"
      - ".clang-tidy"
      - "cppcheck-kf6.cfg"
      - "discover/**"
      - "powerdevil/**"
      - ".github/workflows/cpp-ci.yml"
  # catches upstream branches moving under the patches
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  ci:
    if: github.event_name != 'schedule'
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: FyraLabs/actions/.github/workflows/cpp.yml@main
    with:
      configure-command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS=-Werror
      build-command: cmake --build build --parallel
      test-command: ctest --test-dir build --output-on-failure
      # moc output trips false #error diagnostics from Qt's QObject checks
      # without the qt and KF6 libraries cppcheck skips files with unknownMacro
      # SARIF goes to stderr but the reusable workflow only redirects stdout to build/cppcheck.sarif
      cppcheck-extra-args: -j2 --inline-suppr --suppress=preprocessorErrorDirective:*_autogen* --library=qt --library=cppcheck-kf6.cfg --output-file=build/cppcheck.sarif
      packages: cmake extra-cmake-modules gcc-c++ qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtquickcontrols2-devel kf6-kconfig-devel kf6-kcoreaddons-devel kf6-kcmutils-devel kf6-ki18n-devel kf6-kirigami-devel kf6-kio-devel kf6-kservice-devel kf6-kwidgetsaddons-devel kf6-knewstuff-devel flatpak-devel gettext polkit-devel python3 lld

  translations:
    name: Translation template
    if: github.event_name != 'schedule'
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/fyralabs/ci:f44
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Mark workspace as safe for Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install gettext and polkit's ITS rules
        run: dnf install --assumeyes --setopt=install_weak_deps=False gettext polkit-devel python3

      - name: Regenerate the template
        run: ./Messages.sh

      - name: Check the template is up to date
        run: |
          if [ -n "$(git status --porcelain -- po/)" ]; then
            git --no-pager diff -- po/
            echo "::error file=po/ultramarine-plasma-settings.pot::the translation template is out of date. Run \`just translations\` and commit po/"
            exit 1
          fi

  # Fedora's own patches aren't applied first, so this doesn't replace update.rhai's check
  patches:
    name: Patch ${{ matrix.patch }} on ${{ matrix.repo }} ${{ matrix.ref }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: discover
            ref: Plasma/6.8
            patch: discover/0001-Remove-Discover-updates-UI-in-favor-of-um.patch
          - repo: discover
            ref: master
            patch: discover/0001-Remove-Discover-updates-UI-in-favor-of-um.patch
          - repo: discover
            ref: Plasma/6.7
            patch: discover/6.7/0001-Remove-Discover-updates-UI-in-favor-of-um.patch
          - repo: powerdevil
            ref: Plasma/6.8
            patch: powerdevil/0001-Report-the-idle-state-of-the-session-with-SetIdleHint.patch
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Clone upstream
        run: git clone --depth 1 --branch "${{ matrix.ref }}" "https://invent.kde.org/plasma/${{ matrix.repo }}.git" upstream

      - name: Check the patch applies
        working-directory: upstream
        run: patch -p1 --dry-run --fuzz=0 --batch < "$GITHUB_WORKSPACE/${{ matrix.patch }}"
