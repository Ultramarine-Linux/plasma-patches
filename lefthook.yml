pre-commit:
  jobs:
    - name: clang-format
      glob: "*.{cpp,h}"
      run: cd "$(git rev-parse --show-toplevel)" && just format && git update-index --again
    - name: translations
      glob: "*.{md,mdx}"
      run: cd "$(git rev-parse --show-toplevel)" && just translations && git update-index --again